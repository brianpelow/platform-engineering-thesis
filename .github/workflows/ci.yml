name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown
        run: |
          echo 'Checking thesis structure...
          test -f THESIS.md || exit 1
          test -f README.md || exit 1
          echo 'All required files present'
